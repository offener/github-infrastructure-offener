name: "Plan and Deploy GitHub infrastructure"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP_NAME: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
  AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
  AZURE_CONTAINER_NAME: ${{ secrets.AZURE_CONTAINER_NAME }}
  AZURE_TFSTATE_KEY: ${{ secrets.AZURE_TFSTATE_KEY }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./github-infrastructure
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
        
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install CDKTF
        run: npm install -g cdktf-cli@latest

      - name: Install dependencies
        run: npm ci

      - name: Run cdktf diff
        run: cdktf diff

      - name: Await manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: offener
          minimum-approvals: 1
          issue-title: "Manual approval required before deployment"
          issue-body: "Please approve this workflow to continue deployment."
          exclude-workflow-initiator-as-approver: false

      - name: Run cdktf deploy
        run: echo "works"
        # run: cdktf deploy --auto-approve
